<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    <title>Madhav | UPlate</title>
    <meta name="description" content="Madhav's UPlate business card.">
    <link rel="icon" href="/assets/uplate-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="page shell">
      <section class="card" aria-labelledby="card-title">
        <header class="brand-header">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="brand-name">UPlate</p>
            <p class="brand-line">Your Plate. Your Plan.</p>
          </div>
        </header>

        <div class="rule"></div>

        <p class="eyebrow">Business Card</p>
        <h1 id="card-title">Madhav</h1>
        <p class="person-role">UPlate Team</p>
        <p class="person-meta">Your direct link to UPlate.</p>

        <div class="actions">
          <a class="action" href="mailto:contact@u-plate.com">
            Email
          </a>
          <a class="action" href="https://u-plate.com/">
            Visit UPlate
          </a>
        </div>

        <p class="footer">UPlate Team</p>
      </section>
    </main>
  </body>
</html>
