<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    <title>UPlate Cards</title>
    <meta
      name="description"
      content="Minimal NFC business cards for the UPlate team."
    >
    <link rel="icon" href="/assets/uplate-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="page shell">
      <section class="card directory-card" aria-labelledby="directory-title">
        <header class="brand-header">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="brand-name">UPlate</p>
            <p class="brand-line">Your Plate. Your Plan.</p>
          </div>
        </header>

        <div class="rule"></div>

        <p class="eyebrow">NFC Cards</p>
        <h1 id="directory-title">UPlate team cards</h1>
        <p class="lede">
          Tap a card below to preview one of the four NFC landing pages.
        </p>

        <nav class="card-list" aria-label="UPlate NFC cards">
          <a href="/nathaniel/">Nathaniel</a>
          <a href="/jeffrey/">Jeffrey</a>
          <a href="/Rishu/">Rishu</a>
          <a href="/Madhav/">Madhav</a>
        </nav>
      </section>
    </main>
  </body>
</html>
