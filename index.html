<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#DCEDFF">
    <title>UPlate · Team Cards</title>
    <meta
      name="description"
      content="NFC business cards for the UPlate founding team."
    >
    <link rel="icon" href="/assets/uplate-mark.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
    >
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="page shell">
      <article class="card directory-card" aria-labelledby="directory-title">
        <header class="brand-header">
          <span class="brand-mark" aria-hidden="true"></span>
          <div class="brand-text">
            <p class="brand-name">UPlate</p>
            <p class="brand-line">Your Plate. Your Plan.</p>
          </div>
        </header>

        <p class="eyebrow">NFC Cards</p>
        <h1 id="directory-title" class="directory-title">Team directory</h1>
        <p class="lede">
          Tap a name below to preview that teammate's NFC landing page.
        </p>

        <nav class="card-list" aria-label="UPlate team cards">
          <a href="/nathaniel/">Nathaniel</a>
          <a href="/jeffrey/">Jeffrey</a>
          <a href="/madhav/">Madhav</a>
          <a href="/rishu/">Rishu</a>
        </nav>

        <footer class="card-footer">
          <span>UPlate</span>
          <span>2026</span>
        </footer>
      </article>
    </main>
  </body>
</html>
